# Runtime profile: existing leader schema on Supabase. Tests do not activate this profile.
# .env uses Java properties syntax; OS environment / command-line properties can override it.
spring.config.import=optional:file:./.env[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.enabled=false
spring.sql.init.mode=never
# Keep the persistent backend's connection pool modest on a shared Supabase project.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
