spring.application.name=carrental

spring.datasource.url=jdbc:postgresql://localhost:5432/carrental
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tự động thực thi seed_data.sql (tạo bảng, functions, triggers) và data.sql (dữ liệu mồi) khi chạy dự án
app.database.init.enabled=true

# ---- Function 3: rental orders ----
# Chu xe co bao lau de xac nhan don (phut), khong vuot qua gio nhan xe
app.order.confirm-timeout-minutes=1440
# % hoa hong nen tang chup vao don luc tao (nhom chot so)
app.order.commission-rate=10.00
# Cho phep nhan xe som hon gio dat (phut)
app.order.pickup-early-minutes=60
# Bat khi Function 4 cap nhat payment_status: bat buoc PAID truoc khi nhan xe
app.order.require-payment-before-pickup=false
# Chu ky job tu chuyen don qua han sang EXPIRED (ms)
app.order.expire-check-ms=60000
