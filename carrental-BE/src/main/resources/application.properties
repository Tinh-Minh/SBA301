spring.application.name=carrental

spring.datasource.url=jdbc:postgresql://localhost:5432/carrental
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tự động thực thi seed_data.sql (tạo bảng, functions, triggers) và data.sql (dữ liệu mồi) khi chạy dự án
app.database.init.enabled=true

# ---- Function 3: rental orders ----
# Chu xe co bao lau de xac nhan don (phut), khong vuot qua gio nhan xe
app.order.confirm-timeout-minutes=1440
# % hoa hong nen tang chup vao don luc tao (nhom chot so)
app.order.commission-rate=10.00
# Cho phep nhan xe som hon gio dat (phut)
app.order.pickup-early-minutes=60
# Bat khi Function 4 cap nhat payment_status: bat buoc PAID truoc khi nhan xe
app.order.require-payment-before-pickup=false
# Chu ky job tu chuyen don qua han sang EXPIRED (ms)
app.order.expire-check-ms=60000

# ---- Function 4: VNPay Sandbox Gateway ----
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.tmn-code=${VNPAY_TMN_CODE:UWOEOW84}
vnpay.hash-secret=${VNPAY_HASH_SECRET:MVAVXHAMRBICGXOCXCVBVWDWZOEFARUM}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.refund-create-by=${VNPAY_REFUND_CREATE_BY:CinePrime}
vnpay.refund-ip-address=${VNPAY_REFUND_IP_ADDRESS:127.0.0.1}

booking.payment.webhook-secret=${BOOKING_PAYMENT_WEBHOOK_SECRET:replace-with-a-random-webhook-secret}
payment.refund.sandbox-auto-approve=${PAYMENT_REFUND_SANDBOX_AUTO_APPROVE:false}

