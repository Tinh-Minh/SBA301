spring.application.name=carrental
server.port=8080
app.time.zone=Asia/Ho_Chi_Minh

app.security.jwt.issuer=sba301-rentcar
app.security.jwt.audience=sba301-rentcar-client
app.security.jwt.access-token-ttl=PT30M
app.security.jwt.clock-skew=PT30S
