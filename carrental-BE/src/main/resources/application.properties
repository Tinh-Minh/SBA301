spring.application.name=carrental
server.port=${SERVER_PORT:8080}
app.time.zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

spring.config.import=optional:file:./.env[.properties]

app.security.jwt.issuer=${JWT_ISSUER:sba301-rentcar}
app.security.jwt.audience=${JWT_AUDIENCE:sba301-rentcar-client}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT30M}
app.security.jwt.clock-skew=${JWT_CLOCK_SKEW:PT30S}
app.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
app.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
app.security.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
app.security.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}

app.security.password.min-length=${PASSWORD_MIN_LENGTH:8}
app.security.password.max-utf8-bytes=${PASSWORD_MAX_UTF8_BYTES:72}
app.security.password.bcrypt-strength=${BCRYPT_STRENGTH:10}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,X-Request-ID
app.security.cors.exposed-headers=X-Request-ID

app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:SBA301 Function 1 Test Admin}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:sba301.f1.admin.089d448d54a077ed@example.com}
app.security.bootstrap-admin.phone=${BOOTSTRAP_ADMIN_PHONE:+84982255016}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:XyDnABqUQPKbDQkm!wMYtYvu7vfm}

app.customer.default-page-size=${CUSTOMER_DEFAULT_PAGE_SIZE:20}
app.customer.max-page-size=${CUSTOMER_MAX_PAGE_SIZE:100}
app.customer.status-reason-max-length=${CUSTOMER_STATUS_REASON_MAX_LENGTH:500}

app.document.storage.enabled=${APP_DOCUMENT_STORAGE_ENABLED:true}
app.document.storage.root=${APP_DOCUMENT_STORAGE_ROOT:}
app.document.upload.max-file-size=${APP_DOCUMENT_MAX_FILE_SIZE:5MB}
app.document.upload.max-request-size=${APP_DOCUMENT_MAX_REQUEST_SIZE:11MB}
app.document.upload.max-image-pixels=${APP_DOCUMENT_MAX_IMAGE_PIXELS:20000000}
app.document.upload.max-image-dimension=${APP_DOCUMENT_MAX_IMAGE_DIMENSION:10000}
app.document.list.default-page-size=${DOCUMENT_DEFAULT_PAGE_SIZE:20}
app.document.list.max-page-size=${DOCUMENT_MAX_PAGE_SIZE:100}

spring.servlet.multipart.max-file-size=${app.document.upload.max-file-size}
spring.servlet.multipart.max-request-size=${app.document.upload.max-request-size}
spring.servlet.multipart.file-size-threshold=0B

# Datasource comes only from carrental-BE/.env. Do not add a second URL here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=SET lock_timeout TO '${CUSTOMER_STATUS_LOCK_TIMEOUT_MS:5000}ms'
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# PostgreSQL constraint details may contain submitted values; keep raw JDBC errors out of Hibernate logs.
# Application service logs retain a trace ID and only allowlisted constraint metadata.
spring.jpa.properties.hibernate.jdbc.log.errors=false
spring.jpa.properties.hibernate.jdbc.log.warnings=false
spring.sql.init.mode=never

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/function1
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n

# Function 3/4 configuration merged from F3+4_New; credentials are supplied through environment variables.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
