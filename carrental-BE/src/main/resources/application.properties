# Local PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/carrental
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=SET lock_timeout TO '${CUSTOMER_STATUS_LOCK_TIMEOUT_MS:5000}ms'
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.log.errors=false
# Tu dong thuc thi seed_data.sql (schema) va seed_values.sql (du lieu mau) khi chay du an
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:seed_data.sql
spring.sql.init.data-locations=classpath:seed_values.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/function1
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n

# Function 3/4 configuration
