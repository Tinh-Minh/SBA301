# Cấu hình riêng cho test: dùng H2 trong bộ nhớ, KHÔNG kết nối DB Supabase dùng chung của nhóm.
# INIT tạo kiểu JSONB giả (H2 không có jsonb) cho cột cars.features của entity dùng chung.
spring.application.name=carrental
spring.datasource.url=jdbc:h2:mem:carrental;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.log.errors=false
spring.jpa.properties.hibernate.jdbc.log.warnings=false
spring.sql.init.mode=never
spring.flyway.enabled=false

app.security.jwt.secret-key=function1-test-secret-key-for-hs256-not-for-production
app.database.init.enabled=false
app.scheduling.enabled=false
app.security.password.min-length=8
app.security.password.max-utf8-bytes=72
app.security.password.bcrypt-strength=10
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,X-Request-ID
app.security.cors.exposed-headers=X-Request-ID
app.order.confirm-timeout-minutes=1440
app.order.commission-rate=10.00
app.order.pickup-early-minutes=60
app.order.require-payment-before-pickup=false
app.document.storage.enabled=false
